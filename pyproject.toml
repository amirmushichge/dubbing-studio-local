[project]
name = "local-dubbing-studio"
version = "0.1.0"
description = "Fully local professional video translation and dubbing with voice preservation"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 140
exclude = ["runtime", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
