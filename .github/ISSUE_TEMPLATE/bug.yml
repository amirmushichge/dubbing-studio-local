name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I ran the platform doctor and repeated setup
          required: true
        - label: I have permission to use every voice in the source media
          required: true
        - label: I removed private video, audio, paths and usernames from this report
          required: true
  - type: dropdown
    attributes:
      label: Platform
      options:
        - Windows 10/11 with NVIDIA CUDA
        - macOS 14+ on Apple Silicon
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the expected and actual result, including the stage that failed.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Diagnostics
      description: Paste sanitized doctor output and the relevant text log. Use synthetic media for a reproduction; never publish a private source video or voice sample.
    validations:
      required: true
