name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app workers tools tests
      - name: Lint Python
        run: ruff check app workers tools tests
      - name: Run Python tests
        run: pytest -q
      - name: Check browser JavaScript
        run: |
          node --check static/app.js
          node --test tests/test_project_state.js
      - name: Parse Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Parse macOS launchers
        if: runner.os == 'macOS'
        run: bash -n setup.command start.command doctor.command

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned environments
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements/asr.txt
          pip-audit -r requirements/hymt.txt
          pip-audit -r requirements/macos-hymt.txt
          pip-audit --no-deps --disable-pip -r requirements/seedvc-extra.txt
          pip-audit --no-deps --disable-pip -r requirements/seedvc-overrides.txt
      - name: Verify pinned remote assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/verify_remote_assets.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: |
          version=8.24.3
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
